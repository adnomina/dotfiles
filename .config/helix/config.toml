theme = "catppuccin_macchiato"

[editor]
auto-completion = true
auto-format = true
bufferline = "multiple"
color-modes = true
cursorline = true
editor-config = true
end-of-line-diagnostics = "error"
line-number = "relative"
mouse = false
rulers = [80]
scrolloff = 0
true-color = true

[editor.auto-save]
focus-lost = true

[editor.auto-save.after-delay]
enable = true
timeout = 3000

[editor.indent-guides]
render = true

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.lsp]
display-inlay-hints = true

[editor.soft-wrap]
enable = true
